<section class="cart">
  <h1>עגלה</h1>
  <ul>
    <li *ngFor="let item of store.items()">
      <div>{{ item.book?.title }}</div>
      <div>{{ item.quantity }} x {{ item.unitPrice }} {{ item.currency }}</div>
      <div>{{ item.totalPrice }} {{ item.currency }}</div>
    </li>
  </ul>

  <div class="summary">
    <div>סה"כ פריטים: {{ store.totalBooks() }}</div>
    <div>סה"כ לתשלום: {{ store.totalAmount() }}</div>
  </div>
</section>
